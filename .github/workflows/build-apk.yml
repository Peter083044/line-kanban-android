name: Build Kanban APK

on:
  workflow_dispatch:        # 手动触发：Actions 页点 Run workflow
  push:
    branches: [ main, master ]

# 允许工作流内的 GITHUB_TOKEN 向 Release 发布 APK（无需额外 token）
permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 从 Secrets 注入密钥库（base64 解码为 app/kanban.keystore）
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/kanban.keystore

      # gradle-build-action 自带 Gradle 8.9，无需本地 gradle-wrapper.jar
      - name: Build APKs
        uses: gradle/gradle-build-action@v3
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          gradle-version: 8.9
          arguments: assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 自动把最新 debug APK 覆盖发布到 Release v1.0.0（_pull_apk.py 即拉此文件）
      - name: Publish to GitHub Release (latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 app/build/outputs/apk/debug/app-debug.apk --clobber --repo Peter083044/line-kanban-android

