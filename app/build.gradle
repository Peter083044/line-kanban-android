plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workbuddy.kanban'
    compileSdk 34

    defaultConfig {
        applicationId "com.workbuddy.kanban"
        minSdk 26          // Android 8.0：自适应图标即可，无需位图启动图标（现代工厂平板均满足）
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 固定签名密钥库：确保每次构建（含 debug/CI）使用同一签名，
    // 避免旧版 APK 与新版「签名不一致」导致手机重装失败。
    // 密钥库不再随仓库提交，改为 GitHub Actions Secrets 注入：
    //   - KEYSTORE_BASE64   : keystore 文件的 base64（workflow 解码为 app/kanban.keystore）
    //   - KEYSTORE_PASSWORD : 密钥库密码
    //   - KEY_ALIAS         : 别名
    //   - KEY_PASSWORD      : 私钥密码
    // 本地构建如需签名，可手动放置 app/kanban.keystore 并设置同名环境变量；
    // 该密钥仅适合内网侧载，切勿用于上架应用市场。
    signingConfigs {
        release {
            storeFile file("kanban.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "kanban123"
            keyAlias System.getenv("KEY_ALIAS") ?: "kanban"
            keyPassword System.getenv("KEY_PASSWORD") ?: "kanban123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'   // 保障低版本 WebView 内核能力
}
