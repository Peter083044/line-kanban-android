plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workbuddy.kanban'
    compileSdk 34

    defaultConfig {
        applicationId "com.workbuddy.kanban"
        minSdk 26          // Android 8.0：自适应图标即可，无需位图启动图标（现代工厂平板均满足）
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 固定签名：debug/release 共用同一密钥库，避免重装 APK 时“签名不一致”导致无法安装
    signingConfigs {
        release {
            storeFile file("kanban.keystore")
            storePassword "kanban123"
            keyAlias "kanban"
            keyPassword "kanban123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'   // 保障低版本 WebView 内核能力
}
