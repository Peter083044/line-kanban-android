plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workbuddy.kanban'
    compileSdk 34

    defaultConfig {
        applicationId "com.workbuddy.kanban"
        minSdk 26          // Android 8.0：自适应图标即可，无需位图启动图标（现代工厂平板均满足）
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 固定签名密钥库：确保每次构建（含 debug/CI）使用同一签名，
    // 避免旧版 APK 与新版「签名不一致」导致手机重装失败。
    // 注意：kanban.keystore 已随仓库提交，密码 kanban123 / alias kanban，
    // 仅适合内网侧载，切勿用于上架应用市场。
    signingConfigs {
        release {
            storeFile file("kanban.keystore")
            storePassword "kanban123"
            keyAlias "kanban"
            keyPassword "kanban123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'   // 保障低版本 WebView 内核能力
}
